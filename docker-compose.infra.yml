name: hyrax-infra

services:
  db:
    image: postgres:18.6-alpine
    container_name: hyrax-db
    environment:
      POSTGRES_DB: ${HYRAX_DB_NAME}
      POSTGRES_USER: ${HYRAX_DB_USER}
      POSTGRES_PASSWORD: ${HYRAX_DB_PASSWORD}
    ports:
      - "${HYRAX_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYRAX_DB_USER} -d ${HYRAX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped

  migrator:
    build:
      dockerfile: ./build/Database.Dockerfile
      context: .
    container_name: hyrax-database-migrator
    environment:
      HYRAX_DB_URL: ${HYRAX_DB_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.10.2-alpine
    container_name: hyrax-redis
    environment:
      HYRAX_REDIS_PASSWORD: ${HYRAX_REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${HYRAX_REDIS_PASSWORD}
    ports:
      - "${HYRAX_REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${HYRAX_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
