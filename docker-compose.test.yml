name: hyrax-test

services:
  db-test:
    image: postgres:18.6-alpine
    container_name: hyrax-db-test
    environment:
      POSTGRES_DB: ${HYRAX_DB_NAME}
      POSTGRES_USER: ${HYRAX_DB_USER}
      POSTGRES_PASSWORD: ${HYRAX_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYRAX_DB_USER} -d ${HYRAX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_test_data:/var/lib/postgresql

  migrator:
    build:
      dockerfile: ./build/Database.Dockerfile
      context: .
    container_name: hyrax-database-migrator-test
    environment:
      HYRAX_DB_URL: postgresql://${HYRAX_DB_USER}:${HYRAX_DB_PASSWORD}@db-test:5432/${HYRAX_DB_NAME}?schema=public
    depends_on:
      db-test:
        condition: service_healthy
    restart: "no"

  redis-test:
    image: redis:8.10.2-alpine
    container_name: hyrax-redis-test
    environment:
      HYRAX_REDIS_PASSWORD: ${HYRAX_REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${HYRAX_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${HYRAX_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_test_data:/data

  server-test:
    build:
      dockerfile: ./build/Server.Dockerfile
      context: .
    container_name: hyrax-server-test
    environment:
      HYRAX_DB_URL: postgresql://${HYRAX_DB_USER}:${HYRAX_DB_PASSWORD}@db-test:5432/${HYRAX_DB_NAME}?schema=public
      HYRAX_REDIS_URL: redis://redis-test:6379
      HYRAX_REDIS_PASSWORD: ${HYRAX_REDIS_PASSWORD}
      HYRAX_REDIS_CACHE_TTL_SECONDS: ${HYRAX_REDIS_CACHE_TTL_SECONDS:-60}
      HYRAX_DEV_MODE: ${HYRAX_DEV_MODE:-true}
      HYRAX_SERVER_HTTP_PORT: 3000
      HYRAX_SERVER_CORS_ORIGINS: ${HYRAX_SERVER_CORS_ORIGINS:-http://localhost:5173}
      HYRAX_SERVER_WINDOW_MS_MINUTES: ${HYRAX_SERVER_WINDOW_MS_MINUTES:-15}
      HYRAX_SERVER_REQUEST_LIMIT: ${HYRAX_SERVER_REQUEST_LIMIT:-1000}
      HYRAX_JWT_SECRET: ${HYRAX_JWT_SECRET:?HYRAX_JWT_SECRET is required}
      HYRAX_JWT_ACCESS_TOKEN_TTL_MINUTES: ${HYRAX_JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      HYRAX_JWT_REFRESH_TOKEN_TTL_DAYS: ${HYRAX_JWT_REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - "${HYRAX_SERVER_HTTP_PORT:-3000}:3000"
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  client-test:
    build:
      dockerfile: ./build/Client.Dockerfile
      context: .
    container_name: hyrax-client-test
    ports:
      - "${HYRAX_CLIENT_PORT:-5173}:80"
    depends_on:
      server-test:
        condition: service_started

volumes:
  db_test_data:
  redis_test_data:
