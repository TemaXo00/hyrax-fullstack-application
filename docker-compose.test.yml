services:
  db-test:
    image: postgres:18.6-alpine
    container_name: hyrax-db
    environment:
      POSTGRES_DB: ${HYRAX_DB_NAME}
      POSTGRES_USER: ${HYRAX_DB_USER}
      POSTGRES_PASSWORD: ${HYRAX_DB_PASSWORD}
    ports:
      - "${HYRAX_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYRAX_DB_USER} -d ${HYRAX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_test_data:/var/lib/postrgesql

  client-test:
    build:
      dockerfile: ./build/Client.Dockerfile
      context: .
    container_name: hyrax-client
    ports:
      - "${HYRAX_CLIENT_PORT}:80"

  server-test:
    build:
      dockerfile: ./build/Server.Dockerfile
      context: .
    container_name: hyrax-server
    environment:
      HYRAX_DB_URL: ${HYRAX_DB_URL}
      HYRAX_DEV_MODE: ${HYRAX_DEV_MODE}
      HYRAX_SERVER_CORS_ORIGINS: ${HYRAX_SERVER_CORS_ORIGINS}
      HYRAX_SERVER_WINDOW_MS_MINUTES: ${HYRAX_SERVER_WINDOW_MS_MINUTES}
      HYRAX_SERVER_REQUEST_LIMIT: ${HYRAX_SERVER_REQUEST_LIMIT}
    ports:
      - "${HYRAX_SERVER_HTTP_PORT}:3000"
    depends_on:
     db-test:
      condition: service_healthy

volumes:
  db_test_data:
