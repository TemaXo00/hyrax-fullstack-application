services:
  db:
    image: postgres:18.6-alpine
    container_name: hyrax-db
    environment:
      POSTGRES_DB: ${HYRAX_DB_NAME}
      POSTGRES_USER: ${HYRAX_DB_USER}
      POSTGRES_PASSWORD: ${HYRAX_DB_PASSWORD}
    ports:
      - "${HYRAX_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYRAX_DB_USER} -d ${HYRAX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postrgesql

  client:
    build:
      dockerfile: ./build/Client.Dockerfile
      context: .
    container_name: hyrax-client
    ports:
      - "${HYRAX_CLIENT_PORT}:80"

  server:
    build:
      dockerfile: ./build/Server.Dockerfile
      context: .
    container_name: hyrax-server
    ports:
      - "${HYRAX_SERVER_PORT}:3000"

volumes:
  db_data:
