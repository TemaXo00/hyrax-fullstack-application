name: hyrax-e2e

services:
  db:
    image: postgres:18.6-alpine
    container_name: hyrax-e2e-db
    environment:
      POSTGRES_DB: ${HYRAX_E2E_DB_NAME:-hyrax_e2e}
      POSTGRES_USER: ${HYRAX_E2E_DB_USER:-hyrax}
      POSTGRES_PASSWORD: ${HYRAX_E2E_DB_PASSWORD:-hyrax_e2e_password}
    ports:
      - "${HYRAX_E2E_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
      - /var/run/postgresql

  redis:
    image: redis:8.10.2-alpine
    container_name: hyrax-e2e-redis
    environment:
      HYRAX_E2E_REDIS_PASSWORD: ${HYRAX_E2E_REDIS_PASSWORD:-hyrax_e2e_password}
    command:
      - redis-server
      - --requirepass
      - ${HYRAX_E2E_REDIS_PASSWORD:-hyrax_e2e_password}
    ports:
      - "${HYRAX_E2E_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${HYRAX_E2E_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
